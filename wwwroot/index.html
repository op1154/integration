<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Orders Demo</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #1d4ed8;
        --danger: #dc2626;
        --text: #1f2937;
        --muted: #6b7280;
        --success: #15803d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 1100px;
        margin: 32px auto;
        padding: 0 20px;
      }
      .header {
        background: var(--panel);
        border-radius: 14px;
        padding: 20px 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
        margin-bottom: 24px;
      }
      h1 { margin: 0; }
      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 24px;
      }
      .panel {
        background: var(--panel);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 8px;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 12px 10px;
        margin-bottom: 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: bold;
        cursor: pointer;
      }
      .primary {
        background: var(--primary);
        color: white;
      }
      .danger {
        background: var(--danger);
        color: white;
      }
      .message {
        margin-top: 12px;
        min-height: 24px;
        font-size: 0.95rem;
        color: var(--success);
      }
      .error { color: var(--danger); }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 12px 10px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
      }
      th {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .status {
        display: inline-block;
        padding: 5px 10px;
        background: #e0f2fe;
        color: #075985;
        border-radius: 999px;
        font-size: 0.8rem;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Pedidos ERP Demo</h1>
      </div>

      <div class="layout">
        <section class="panel">
          <h2>Novo Pedido</h2>
          <form id="orderForm">
            <label for="customerName">Cliente</label>
            <input id="customerName" name="customerName" required />

            <label for="productName">Produto</label>
            <input id="productName" name="productName" required />

            <label for="quantity">Quantidade</label>
            <input id="quantity" name="quantity" type="number" min="1" value="1" required />

            <label for="total">Valor Total</label>
            <input id="total" name="total" type="number" step="0.01" min="0.01" required />

            <button class="primary" type="submit">Salvar pedido</button>
          </form>
          <div id="formMessage" class="message"></div>
        </section>

        <section class="panel">
          <h2>Lista de Pedidos</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Total</th>
                <th>Status</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </section>
      </div>
    </div>

    <script>
      const tableBody = document.getElementById('ordersTableBody');
      const form = document.getElementById('orderForm');
      const formMessage = document.getElementById('formMessage');

      async function loadOrders() {
        const response = await fetch('/api/orders');
        const orders = await response.json();

        if (!orders.length) {
          tableBody.innerHTML = '<tr><td colspan="7" class="empty">Nenhum pedido encontrado.</td></tr>';
          return;
        }

        tableBody.innerHTML = orders.map(order => `
          <tr>
            <td>${order.id}</td>
            <td>${order.customerName}</td>
            <td>${order.productName}</td>
            <td>${order.quantity}</td>
            <td>R$ ${Number(order.total).toFixed(2)}</td>
            <td><span class="status">${order.status}</span></td>
            <td>
              <button class="danger" data-id="${order.id}" type="button">Excluir</button>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-id]').forEach(button => {
          button.addEventListener('click', async () => {
            await deleteOrder(button.dataset.id);
          });
        });
      }

      async function deleteOrder(id) {
        const response = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        const result = await response.json();

        if (!response.ok) {
          formMessage.classList.add('error');
          formMessage.textContent = result.message || 'Erro ao excluir pedido.';
          return;
        }

        formMessage.classList.remove('error');
        formMessage.textContent = result.message || 'Pedido excluído com sucesso.';
        loadOrders();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          customerName: document.getElementById('customerName').value,
          productName: document.getElementById('productName').value,
          quantity: Number(document.getElementById('quantity').value),
          total: Number(document.getElementById('total').value)
        };

        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          formMessage.classList.add('error');
          formMessage.textContent = result.error || 'Erro ao criar pedido.';
          return;
        }

        form.reset();
        document.getElementById('quantity').value = '1';
        formMessage.classList.remove('error');
        formMessage.textContent = `Pedido ${result.id} criado com sucesso.`;
        loadOrders();
      });

      loadOrders();
    </script>
  </body>
</html>
